---
name: Generate debug keystore (one-off)

# One-off helper: produces a stable PKCS12 debug keystore and uploads it as an
# artifact. Download it and commit to app/debug-signing/hoshi-debug.p12 so every
# debug build shares a signature (debug keys are not secret). Then delete this file.

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Generate PKCS12 keystore
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair \
            -keystore hoshi-debug.p12 \
            -storetype PKCS12 \
            -storepass android \
            -keypass android \
            -alias hoshidebug \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Hoshi Debug, OU=Hoshi, O=Hoshi, L=NA, ST=NA, C=US"
          keytool -list -v -keystore hoshi-debug.p12 -storepass android | head -20

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: hoshi-debug-keystore
          path: hoshi-debug.p12
          if-no-files-found: error

---
name: Build Hoshi Custom APK

# Manually triggered build that produces an installable, stably debug-signed APK
# (version derived from the commit count so each build is detectably newer) and
# publishes it to a non-prerelease GitHub Release on this fork. The in-app update
# check for debug builds points at this fork's releases/latest.

"on":
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build and publish Hoshi Custom APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      CMAKE_VERSION: "3.22.1"
      NDK_VERSION: "27.2.12479018"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize required submodules
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init --recursive third_party/hoshidicts-kotlin-bridge
          git submodule status --recursive

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          maj="${version_name%%.*}"
          rest="${version_name#*.}"
          min="${rest%%.*}"
          n="$(git rev-list --count HEAD)"
          ver="${maj}.${min}.${n}"
          code=$((maj * 10000 + min * 100 + n))
          {
            echo "ver=${ver}"
            echo "code=${code}"
          } >> "${GITHUB_OUTPUT}"
          echo "Resolved version ${ver} (code ${code})"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            "platforms;android-36.1" \
            "build-tools;36.0.0" \
            "cmake;${CMAKE_VERSION}" \
            "ndk;${NDK_VERSION}"
          ndk_home="${ANDROID_HOME}/ndk/${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ndk_home}" >> "${GITHUB_ENV}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src/main/rust/hoshiepub

      - name: Install cargo-ndk
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk --locked
          fi

      - name: Restore Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon assembleDebug \
            -PreleaseVersionName="${{ steps.version.outputs.ver }}" \
            -PreleaseVersionCode="${{ steps.version.outputs.code }}"

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          src="app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -f "${src}" ]]; then
            echo "Debug APK not found at ${src}" >&2
            find app/build/outputs/apk -type f -name '*.apk' -print >&2 || true
            exit 1
          fi
          asset="Hoshi-Reader-v${{ steps.version.outputs.ver }}.apk"
          cp "${src}" "${asset}"
          echo "asset=${asset}" >> "${GITHUB_OUTPUT}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hoshi-custom-apk
          path: ${{ steps.apk.outputs.asset }}
          if-no-files-found: error

      - name: Publish to a Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ver="${{ steps.version.outputs.ver }}"
          tag="v${ver}"
          asset="${{ steps.apk.outputs.asset }}"
          gh release delete "${tag}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "${tag}" "${asset}" \
            --title "Hoshi Custom v${ver}" \
            --notes "Custom Hoshi Reader build (upstream + multilingual hoshidicts lookup, learning profiles, and JSON settings backup). Installs as a separate app 'Hoshi Custom'. Debug-signed for personal sideloading; in-app updates track this fork's releases."

      - name: Run unit tests (informational, non-blocking)
        continue-on-error: true
        shell: bash
        run: ./gradlew --no-daemon test
